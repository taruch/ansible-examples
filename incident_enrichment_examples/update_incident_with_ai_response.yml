---
# Update a ServiceNow incident's work notes with a response generated by an
# AI prompt in an earlier AAP workflow node.
#
# This playbook does NOT call any AI model itself - it only consumes the
# text response produced upstream (e.g. an AAP AI/Lightspeed prompt node,
# or another job template) and writes it into the incident's work notes.
#
# Assumes execution as an AAP job template with a ServiceNow credential
# attached - the credential injects SN_HOST/SN_USERNAME/SN_PASSWORD as
# environment variables, so no ServiceNow secrets are passed as extra vars.
#
# Required variables:
#   - incident_number: ServiceNow incident number (e.g. INC0010001)
#   - ai_response: Text response from the AI prompt (also accepted via
#                   workflow_job.artifacts.ai_response from a previous node)

- name: Update ServiceNow Incident with AI-Generated Work Notes
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Set current timestamp
      ansible.builtin.set_fact:
        current_timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Get ai_response from workflow artifacts (set_stats from previous node)
      ansible.builtin.set_fact:
        ai_response: "{{ workflow_job.artifacts.ai_response | default(ai_response | default('')) }}"
      when: workflow_job is defined

    - name: Look up ServiceNow credential injected by the AAP job template
      ansible.builtin.set_fact:
        sn_host: "{{ lookup('env', 'SN_HOST') }}"
        sn_username: "{{ lookup('env', 'SN_USERNAME') }}"
        sn_password: "{{ lookup('env', 'SN_PASSWORD') }}"
      no_log: true

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - incident_number is defined
          - ai_response is defined
          - ai_response | length > 0
          - sn_host | length > 0
          - sn_username | length > 0
          - sn_password | length > 0
        fail_msg: >-
          Missing required variables: incident_number or ai_response, or the
          AAP job template is missing an attached ServiceNow credential
          (SN_HOST/SN_USERNAME/SN_PASSWORD).

    - name: Build incident work notes from AI response
      ansible.builtin.set_fact:
        work_notes_text: |
          === AI-GENERATED INCIDENT ANALYSIS ===
          Report Timestamp: {{ current_timestamp }}

          {{ ai_response }}

          === END AI-GENERATED ANALYSIS ===

    - name: Update ServiceNow incident with work notes
      servicenow.itsm.incident:
        instance:
          host: "{{ sn_host }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        state: present
        number: "{{ incident_number }}"
        other:
          work_notes: "{{ work_notes_text }}"
      register: incident_update

    - name: Extract sys_id from response
      ansible.builtin.set_fact:
        incident_sys_id: "{{ incident_update.record.sys_id }}"

    - name: Display update summary
      ansible.builtin.debug:
        msg:
          - "=== SERVICENOW INCIDENT UPDATE SUMMARY ==="
          - "Incident Number: {{ incident_number }}"
          - "Incident Sys ID: {{ incident_sys_id }}"
          - "ServiceNow Link: https://{{ sn_host }}/nav_to.do?uri=incident.do?sys_id={{ incident_sys_id }}"

    - name: Set stats for AAP dashboard
      ansible.builtin.set_stats:
        data:
          incident_number: "{{ incident_number }}"
          incident_sys_id: "{{ incident_sys_id }}"
          servicenow_link: "https://{{ sn_host }}/nav_to.do?uri=incident.do?sys_id={{ incident_sys_id }}"
          update_status: "success"
        aggregate: false
