---
# Adds a work note to a ServiceNow incident containing the [AAP-REVIEWED]
# marker, so it stops matching EDA rulebook queries that filter on
# work_notesNOT LIKE[AAP-REVIEWED] (e.g.
# sysparm_query: "active=true^state=1^work_notesNOT LIKE[AAP-REVIEWED]").
# Does not change state or any other field visible to ops staff.
#
# NOTE: work_notes is a journal field, so ISEMPTY/ISNOTEMPTY against it is
# not reliable via sysparm_query (its aggregate value is never readable back
# through the REST Table API either - a record's work_notes field always
# reads back blank regardless of history). LIKE/NOT LIKE content-matching
# against journal fields, by contrast, is a standard, documented ServiceNow
# query operator (see servicenow.itsm's module_utils/query.py, OPERATORS_STRING)
# and is the supported way to filter on journal field content. This is the
# mechanism this gate relies on - verify it against your instance before
# depending on it in production.
#
# Assumes execution as an AAP job template with a ServiceNow credential
# attached - the credential injects SN_HOST/SN_USERNAME/SN_PASSWORD as
# environment variables, so no ServiceNow secrets are passed as extra vars.
#
# Required variables:
#   - incident_number: ServiceNow incident number (e.g. INC0010001)
#
# Optional variables:
#   - work_note: Work note text to add (defaults to a generic message below)
#
# Usage:
#   ansible-playbook servicenow_add_enrichment_note.yml -e "incident_number=INC0010001"

- name: Add an enrichment-in-progress work note to a ServiceNow incident
  hosts: localhost
  gather_facts: false

  vars:
    work_note: "[AAP-REVIEWED] Ansible Automation Platform reviewed this incident for automated enrichment."

  tasks:
    - name: Look up ServiceNow credential injected by the AAP job template
      ansible.builtin.set_fact:
        sn_host: "{{ lookup('env', 'SN_HOST') }}"
        sn_username: "{{ lookup('env', 'SN_USERNAME') }}"
        sn_password: "{{ lookup('env', 'SN_PASSWORD') }}"
      no_log: true

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - incident_number is defined
          - incident_number | length > 0
          - sn_host | length > 0
          - sn_username | length > 0
          - sn_password | length > 0
        fail_msg: >-
          Missing required variables: incident_number, or the AAP job
          template is missing an attached ServiceNow credential
          (SN_HOST/SN_USERNAME/SN_PASSWORD).

    - name: Add work note to the incident
      servicenow.itsm.incident:
        instance:
          host: "{{ sn_host }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        number: "{{ incident_number }}"
        other:
          work_notes: "{{ work_note }}"
      register: incident_update

    - name: Display result
      ansible.builtin.debug:
        msg: "Added work note to incident {{ incident_number }}: {{ work_note }}"

    - name: Set stats for AAP dashboard / downstream workflow node
      ansible.builtin.set_stats:
        data:
          incident_number: "{{ incident_number }}"
          incident_sys_id: "{{ incident_update.record.sys_id }}"
          servicenow_link: "https://{{ sn_host }}/nav_to.do?uri=incident.do?sys_id={{ incident_update.record.sys_id }}"
        aggregate: false
