---
- name: Incident Enrichment Investigation
  hosts: "{{ _hosts | default('all') }}"
  gather_facts: true

  vars:
    # issue (webhook/workflow-facing term) -> incident_type (role-facing term)
    _incident_type_map:
      cpu: cpu
      memory: memory
      storage: disk

  tasks:
    - name: Validate issue parameter
      ansible.builtin.assert:
        that:
          - issue is defined
          - issue in ['cpu', 'memory', 'storage']
        fail_msg: "Issue must be defined and set to 'cpu', 'memory', or 'storage'"
        success_msg: "Valid issue type: {{ issue }}"

    - name: Include incident enrichment role
      ansible.builtin.include_role:
        name: incident_enrichment
      vars:
        incident_type: "{{ _incident_type_map[issue] }}"

    - name: Set workflow artifacts for next node (ServiceNow update)
      ansible.builtin.set_stats:
        data:
          alert_data: "{{ alert_report_json }}"
        per_host: false
        aggregate: true
