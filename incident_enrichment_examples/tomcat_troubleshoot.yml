---
# Read-only Tomcat diagnostics for RHEL hosts. Gathers service status, XML
# config validation, recent journalctl/catalina.out log entries, disk
# space, listening ports, and SELinux denials, then consolidates everything
# into a single `tomcat_diagnostics` JSON structure intended for an AI agent
# (e.g. a Claude step in an Automation Orchestrator workflow) to decide on a
# remediation action. This playbook does not restart, reconfigure, or
# otherwise change anything on the target host.
#
# Usage:
#   ansible-playbook tomcat_troubleshoot.yml -e "_hosts=node1"

- name: Troubleshoot Tomcat on RHEL
  hosts: "{{ _hosts | default('') }}"
  become: true
  gather_facts: true

  vars:
    tomcat_service_name: tomcat
    tomcat_home: /usr/share/tomcat
    tomcat_conf_dir: /etc/tomcat
    tomcat_log_dir: /var/log/tomcat
    tomcat_catalina_log: "{{ tomcat_log_dir }}/catalina.out"
    tomcat_webapps_dir: "{{ tomcat_home }}/webapps"
    tomcat_log_lines: 100
    journalctl_lines: 200

  tasks:
    - name: Verify target host is running RHEL
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
        fail_msg: >-
          This playbook only supports Red Hat family hosts (tomcat package
          names/paths differ on Debian/Ubuntu). Detected distribution:
          {{ ansible_facts['distribution'] | default('unknown') }}.

    - name: Check whether tomcat is installed
      ansible.builtin.command: rpm -q tomcat
      register: tomcat_installed
      changed_when: false
      failed_when: false

    - name: Get tomcat systemd status fields
      ansible.builtin.command: >-
        systemctl show {{ tomcat_service_name }} --no-page
        -p ActiveState -p SubState -p UnitFileState
        -p ActiveEnterTimestamp -p MainPID -p Result
      register: tomcat_systemctl_show
      changed_when: false
      failed_when: false
      when: tomcat_installed.rc == 0

    - name: Parse tomcat systemd status fields
      ansible.builtin.set_fact:
        tomcat_status: "{{ tomcat_status | default({}) | combine({item.split('=')[0]: item.split('=', 1)[1]}) }}"
      loop: "{{ tomcat_systemctl_show.stdout_lines | default([]) }}"
      when: tomcat_installed.rc == 0

    - name: Validate Tomcat server.xml syntax
      ansible.builtin.command: xmllint --noout {{ tomcat_conf_dir }}/server.xml
      register: tomcat_configtest
      changed_when: false
      failed_when: false
      when: tomcat_installed.rc == 0

    - name: Get recent journalctl entries for tomcat
      ansible.builtin.command: journalctl -u {{ tomcat_service_name }} --no-pager -n {{ journalctl_lines }} -o short-iso
      register: tomcat_journal
      changed_when: false
      failed_when: false
      when: tomcat_installed.rc == 0

    - name: Get recent catalina.out log entries
      ansible.builtin.command: tail -n {{ tomcat_log_lines }} {{ tomcat_catalina_log }}
      register: tomcat_catalina_out
      changed_when: false
      failed_when: false

    - name: Check disk usage for filesystems backing Tomcat logs/webapps
      ansible.builtin.shell: |
        df -h {{ tomcat_log_dir }} {{ tomcat_webapps_dir }} 2>/dev/null | awk 'NR>1 {print $1,$2,$3,$4,$5,$6}'
      register: tomcat_disk_usage
      changed_when: false
      failed_when: false

    - name: Parse disk usage
      ansible.builtin.set_fact:
        tomcat_disk_volumes: "{{ tomcat_disk_volumes | default([]) + [{'filesystem': item.split()[0], 'size': item.split()[1], 'used': item.split()[2], 'available': item.split()[3], 'percent_used': item.split()[4] | replace('%', '') | int, 'mount_point': item.split()[5]}] }}"
      loop: "{{ tomcat_disk_usage.stdout_lines | default([]) }}"

    - name: Check whether tomcat is listening on expected ports
      ansible.builtin.shell: |
        ss -tlnp 2>/dev/null | grep -E ':(8080|8443)\b' || true
      register: tomcat_listening_ports
      changed_when: false

    - name: Get SELinux enforcement mode
      ansible.builtin.command: getenforce
      register: selinux_mode
      changed_when: false
      failed_when: false

    - name: Check for recent SELinux denials related to tomcat
      ansible.builtin.shell: |
        ausearch -m avc -ts recent -se tomcat_t 2>/dev/null || true
      register: selinux_denials
      changed_when: false
      failed_when: false
      when: selinux_mode.stdout | default('') == 'Enforcing'

    - name: Build consolidated Tomcat diagnostics report
      ansible.builtin.set_fact:
        tomcat_diagnostics:
          host: "{{ inventory_hostname }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
          system_info:
            os_distribution: "{{ ansible_distribution }}"
            os_version: "{{ ansible_distribution_version }}"
            kernel_version: "{{ ansible_kernel }}"
            hostname: "{{ ansible_hostname }}"
            fqdn: "{{ ansible_fqdn }}"
          tomcat_installed: "{{ tomcat_installed.rc == 0 }}"
          tomcat_package_version: "{{ tomcat_installed.stdout | default('') }}"
          service_status: "{{ tomcat_status | default({}) }}"
          config_test:
            passed: "{{ (tomcat_configtest.rc | default(1)) == 0 }}"
            output: "{{ (tomcat_configtest.stdout_lines | default([])) + (tomcat_configtest.stderr_lines | default([])) }}"
          journalctl_recent: "{{ tomcat_journal.stdout_lines | default([]) }}"
          catalina_log_recent: "{{ tomcat_catalina_out.stdout_lines | default([]) }}"
          disk_volumes: "{{ tomcat_disk_volumes | default([]) }}"
          listening_ports: "{{ tomcat_listening_ports.stdout_lines | default([]) }}"
          selinux:
            mode: "{{ selinux_mode.stdout | default('unknown') }}"
            recent_denials: "{{ selinux_denials.stdout_lines | default([]) }}"

    - name: Display Tomcat diagnostics summary
      ansible.builtin.debug:
        var: tomcat_diagnostics

    - name: Set stats for AAP dashboard / downstream workflow node
      ansible.builtin.set_stats:
        data:
          tomcat_diagnostics: "{{ tomcat_diagnostics }}"
        per_host: false
        aggregate: false
