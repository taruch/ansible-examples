---
# Examples showing how to combine dynamic groups to target specific device sets.
# These patterns work with both ansible-playbook --limit and AAP job template limits.

# Example 1: Target a very specific set of devices
# Alcatel OS6860E-P48 edge switches in Rose Hill Building A
- name: Target specific vendor + model + function + site + building
  hosts: vendor_alcatel:&model_OS6860E_P48:&func_edge_switch:&site_rose_hill:&bldg_building_a
  gather_facts: false
  tasks:
    - name: Show targeted device
      ansible.builtin.debug:
        msg: "Targeted: {{ inventory_hostname }} ({{ device_model }} - {{ device_function_name }} at {{ device_site }}/{{ device_building }})"

# Example 2: All edge switches at Rose Hill (any vendor, any building)
- name: All edge switches at one site
  hosts: edge_switches:&site_rose_hill
  gather_facts: false
  tasks:
    - name: Show targeted device
      ansible.builtin.debug:
        msg: "Edge switch at Rose Hill: {{ inventory_hostname }} ({{ device_vendor }} {{ device_model }})"

# Example 3: All Alcatel switches across all sites
- name: All Alcatel switches everywhere
  hosts: alcatel:&all_switches
  gather_facts: false
  tasks:
    - name: Show targeted device
      ansible.builtin.debug:
        msg: "Alcatel switch: {{ inventory_hostname }} ({{ device_model }} at {{ device_site }})"

# Example 4: All building routers (MDRs) across all sites
- name: All building routers
  hosts: all_routers
  gather_facts: false
  tasks:
    - name: Show targeted device
      ansible.builtin.debug:
        msg: "Router: {{ inventory_hostname }} ({{ device_model }} at {{ device_site }}/{{ device_building }})"

# Example 5: Everything in a single building
- name: All devices in Rose Hill Building B
  hosts: campus_rose_hill_building_b
  gather_facts: false
  tasks:
    - name: Show targeted device
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ device_function_name }} ({{ device_vendor }} {{ device_model }})"

# Example 6: All data center devices
- name: All data center devices
  hosts: datacenter
  gather_facts: false
  tasks:
    - name: Show targeted device
      ansible.builtin.debug:
        msg: "DC device: {{ inventory_hostname }} ({{ device_function_name }})"

# Example 7: All firewalls across all sites
- name: All firewalls
  hosts: firewalls
  gather_facts: false
  tasks:
    - name: Show targeted device
      ansible.builtin.debug:
        msg: "Firewall: {{ inventory_hostname }} ({{ device_vendor }} {{ device_model }} at {{ device_site }})"

# Example 8: All devices of a specific model across all sites
- name: All OS6900-X20 devices everywhere
  hosts: model_OS6900_X20
  gather_facts: false
  tasks:
    - name: Show targeted device
      ansible.builtin.debug:
        msg: "OS6900-X20: {{ inventory_hostname }} ({{ device_function_name }} at {{ device_site }})"

# Example 9: Combine vendor + site (all Extreme devices at Rose Hill)
- name: Extreme devices at Rose Hill
  hosts: vendor_extreme:&site_rose_hill
  gather_facts: false
  tasks:
    - name: Show targeted device
      ansible.builtin.debug:
        msg: "Extreme at Rose Hill: {{ inventory_hostname }} ({{ device_model }})"

# Example 10: Using --limit or AAP survey to make playbooks reusable
# This single playbook works for ANY combination when you pass the limit
# via AAP survey or command line:
#
#   ansible-playbook example_playbooks.yml --limit "edge_switches:&site_rose_hill"
#   ansible-playbook example_playbooks.yml --limit "alcatel:&all_switches"
#   ansible-playbook example_playbooks.yml --limit "campus_lincoln_center_building_a"
#   ansible-playbook example_playbooks.yml --limit "model_OS6860E_P48:&site_rose_hill:&bldg_building_a"
#
# In AAP, create a job template with a survey that prompts for _hosts,
# then set the Limit field to {{ _hosts }}. Users pick the group
# combination at launch time.
