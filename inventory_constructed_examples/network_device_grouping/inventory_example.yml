---
# Example static inventory showing how to define device attributes as host variables.
# In AAP, these variables would be set on each host in the inventory UI,
# imported via an inventory source, or populated by a CMDB sync.
#
# The constructed inventory source (constructed_network_devices.yml) reads
# these variables and builds dynamic, combinable groups automatically.

