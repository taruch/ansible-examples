---
# Services to restart after patching (those stopped in pre_patching).
# Works for both Linux (systemd unit names) and Windows (service names, e.g.
# "W3SVC" for IIS) — the role dispatches to the right module per OS.
services_to_start: []

# IIS application pool names to confirm are started after patching (Windows only).
# Also self-heals: if found stopped, the role starts it before asserting.
iis_app_pools_to_check: []

# IIS website names to confirm are started after patching (Windows only).
# Also self-heals: if found stopped, the role starts it before asserting.
iis_sites_to_check: []

# HTTP application health check endpoints to verify after reboot (Linux only —
# ansible.builtin.uri does not run against Windows targets over WinRM).
health_check_urls: []

# HTTP checks run directly on the Windows host via win_uri (e.g. "http://localhost/")
# to confirm IIS is actually serving traffic, not just that the service is running.
iis_local_health_check_urls: []

# TCP port health checks: list of {host: ..., port: ..., timeout: ...}
tcp_health_checks: []

# Reboot timeout settings
reboot_timeout: 600
reboot_connect_timeout: 20
reboot_pre_reboot_delay: 5
reboot_post_reboot_delay: 30

# Monitoring maintenance mode provider (must match pre_patching value)
monitoring_provider: ""
monitoring_url: ""
monitoring_api_key: ""

# Platform-conditional report directory (must match pre_patching value)
patch_report_dir: "{{ 'C:\\ProgramData\\patch_reports' if ansible_facts.os_family == 'Windows' else '/var/log/patch_reports' }}"
