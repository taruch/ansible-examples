---
# Export configuration from an Ansible Tower 3.8 instance (the engine
# bundled with Red Hat Ansible Automation Platform 1.2).
#
# Tower 3.8.0's own release notes call out that this is the version where
# the config-as-code import/export feature was introduced, via the (then
# new) `ansible.tower` certified collection - the AAP-1.x-era predecessor
# of `ansible.controller`, which targets AAP 2.x only and isn't a fit here.
# `ansible.tower` is Automation-Hub-only (not on public Galaxy, requires a
# subscription); this playbook uses the community `awx.awx` collection's
# `export` module instead, since it's the same underlying module/codebase
# and doesn't require Hub access. If you do have Automation Hub configured,
# swap `awx.awx.export` for `ansible.tower.export` below - same arguments.
#
# Collection version: pin awx.awx to 17.1.0 for this playbook - the last
# release before the collection adopted the "Automation Platform
# Controller" naming/API assumptions at 18.0.0 (the point where the
# collection and AWX itself transitioned towards the AAP 2.0/Controller 4.0
# era). 17.1.0 is the newest release still inside the window contemporary
# with Tower 3.8.x, using the same boundary-release logic as pinning
# collection versions for Tower 3.6.3 elsewhere in this file's history.
# Note Tower 3.8.x itself remained in support well into the AAP 2.0
# timeframe (AAP 1.2.x shipped a late "transition venvs to execution
# environments" feature to ease migration to 2.x), so this boundary is
# judgment-based on API assumptions, not a hard compatibility cutoff.
#
# As with the other export playbooks in this directory, this does not
# export actual credential secrets - those come back as "$encrypted$".
#
# Python requirement: the awx.awx `export` module shells out to the awxkit
# library directly (it is not a plain REST call), so awxkit must be
# importable by the Python interpreter running this playbook - installing
# the awx.awx collection alone is not enough. Match it to the collection
# pin above:
#   pip install awxkit==17.1.0
# A mismatched awxkit (e.g. a newer one installed separately/already on the
# control node) can talk to a newer AWX/Controller API than Tower 3.8
# actually has, which is the same compatibility risk described above for
# newer awx.awx releases. If running under an execution environment, bake
# awxkit==17.1.0 into its requirements.txt rather than relying on whatever
# the base image happens to ship.
#
# This playbook is not registered in collections/requirements.yml - add
# `awx.awx` there yourself (pinned as above) if you want it installed via
# the usual `ansible-galaxy collection install -r collections/requirements.yml`
# flow for this directory.

- name: Export configuration from Ansible Tower 3.8
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    controller_username: "{{ vault_controller_username | default(lookup('env', 'CONTROLLER_USERNAME')) }}"
    controller_password: "{{ vault_controller_password | default(lookup('env', 'CONTROLLER_PASSWORD')) }}"
    controller_hostname: "{{ vault_controller_hostname | default(lookup('env', 'CONTROLLER_HOST')) }}"
    controller_validate_certs: "{{ vault_controller_validate_certs | default(lookup('env', 'CONTROLLER_VERIFY_SSL')) }}"
    export_dest: "./export_tower_38.json"

  pre_tasks:
    - name: "Setup authentication (block)"
      when: controller_oauthtoken is not defined
      block:
        - name: "Get the Authentication Token for the future requests"
          ansible.builtin.uri:
            url: "https://{{ controller_hostname }}/api/v2/tokens/"
            user: "{{ controller_username }}"
            password: "{{ controller_password }}"
            method: POST
            force_basic_auth: true
            validate_certs: "{{ controller_validate_certs }}"
            status_code: 201
          register: authtoken_res

        - name: "Set the oauth token to be used since now"
          ansible.builtin.set_fact:
            controller_oauthtoken: "{{ authtoken_res.json.token }}"
            controller_oauthtoken_url: "{{ authtoken_res.json.url }}"

  tasks:
    - name: Export all assets from Tower
      awx.awx.export:
        all: true
        controller_host: "{{ controller_hostname }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"
      register: tower_export_result

    - name: Write export to file
      ansible.builtin.copy:
        content: "{{ tower_export_result.assets | to_nice_json }}"
        dest: "{{ export_dest }}"

  post_tasks:
    - name: "Delete the Authentication Token used"
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}{{ controller_oauthtoken_url }}"
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        method: DELETE
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs }}"
        status_code: 204
      when: controller_oauthtoken_url is defined

...
