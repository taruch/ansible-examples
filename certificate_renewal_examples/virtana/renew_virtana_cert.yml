---
# Renew the SSL certificate on a Virtana appliance (Infrastructure Observability / VirtualWisdom).
# Virtana does not expose certificate management via its public REST API.
#
# IMPORTANT: Virtana appliance architectures vary by product and version.
# This playbook provides three methods — set appliance_type to match your environment:
#
#   virtana_config  - Modern IO appliances with the virtana-config CLI utility
#   k3s             - Global View / Platform appliances using K3s (Kubernetes) and kubectl
#   legacy          - Older VirtualWisdom appliances using nginx with cert files on disk
#
# Verify the correct method for your appliance version in the Virtana IO Administrator
# Guide under Appliance Configuration > Certificate Management before running.

- name: Renew Virtana appliance SSL certificate
  hosts: virtana
  become: true

  vars:
    cert_name: "{{ inventory_hostname | regex_replace('\\.', '_') }}"

    # Local (control node) cert sources
    cert_src: "files/{{ cert_name }}.crt"
    key_src: "files/{{ cert_name }}.key"
    chain_src: "files/{{ cert_name }}_chain.crt"

    # Appliance type — choose the method that matches your appliance:
    #   virtana_config  - uses: virtana-config --update-ssl
    #   k3s             - uses: kubectl create secret tls
    #   legacy          - uses: file copy + nginx restart
    appliance_type: virtana_config

    # Legacy cert paths (only used when appliance_type == legacy)
    legacy_cert_dir: "/etc/pki/tls/certs"
    legacy_key_dir: "/etc/pki/tls/private"

    # K3s options (only used when appliance_type == k3s)
    k3s_namespace: "default"
    k3s_secret_name: "virtana-tls"

    # Backup
    backup_dir: "/opt/virtana/backups"
    backup_suffix: "{{ ansible_date_time.date }}"

  pre_tasks:
    - name: Verify local cert files exist on control node
      ansible.builtin.stat:
        path: "{{ item }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: src_files
      failed_when: not src_files.stat.exists
      loop:
        - "{{ cert_src }}"
        - "{{ key_src }}"

    - name: Read new cert metadata
      community.crypto.x509_certificate_info:
        path: "{{ cert_src }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: cert_info

    - name: Show new cert validity
      ansible.builtin.debug:
        msg: >-
          New cert subject={{ cert_info.subject.commonName | default('?') }}
          not_after={{ cert_info.not_after }}
      run_once: true

  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    # -----------------------------------------------------------------------
    # Transfer cert files to the appliance
    # -----------------------------------------------------------------------

    - name: Copy certificate to appliance
      ansible.builtin.copy:
        src: "{{ cert_src }}"
        dest: "/tmp/{{ cert_name }}.crt"
        owner: root
        group: root
        mode: "0644"

    - name: Copy private key to appliance
      ansible.builtin.copy:
        src: "{{ key_src }}"
        dest: "/tmp/{{ cert_name }}.key"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Copy CA chain to appliance
      ansible.builtin.copy:
        src: "{{ chain_src }}"
        dest: "/tmp/{{ cert_name }}_chain.pem"
        owner: root
        group: root
        mode: "0644"
      when: chain_src is defined

    # -----------------------------------------------------------------------
    # Method 1: virtana-config CLI (modern IO appliances)
    # -----------------------------------------------------------------------

    - name: Renew certificate via virtana-config
      when: appliance_type == "virtana_config"
      block:
        - name: Backup current SSL files
          ansible.builtin.shell: >-
            cp -a /etc/pki/tls/certs/ {{ backup_dir }}/certs_{{ backup_suffix }}/ 2>/dev/null;
            cp -a /etc/pki/tls/private/ {{ backup_dir }}/private_{{ backup_suffix }}/ 2>/dev/null;
            cp -a /etc/nginx/certs/ {{ backup_dir }}/nginx_certs_{{ backup_suffix }}/ 2>/dev/null;
            true
          changed_when: true

        - name: Update SSL certificate via virtana-config
          ansible.builtin.command:
            cmd: >-
              virtana-config --update-ssl
              --cert /tmp/{{ cert_name }}.crt
              --key /tmp/{{ cert_name }}.key
              --chain /tmp/{{ cert_name }}_chain.pem
          no_log: true

        - name: Restart nginx
          ansible.builtin.systemd:
            name: nginx
            state: restarted

    # -----------------------------------------------------------------------
    # Method 2: K3s / kubectl (Global View / Platform appliances)
    # -----------------------------------------------------------------------

    - name: Renew certificate via K3s secret
      when: appliance_type == "k3s"
      block:
        - name: Backup current TLS secret
          ansible.builtin.shell: >-
            kubectl get secret {{ k3s_secret_name }}
            -n {{ k3s_namespace }}
            -o yaml > {{ backup_dir }}/{{ k3s_secret_name }}_{{ backup_suffix }}.yaml
          changed_when: true
          failed_when: false

        - name: Delete existing TLS secret
          ansible.builtin.command:
            cmd: >-
              kubectl delete secret {{ k3s_secret_name }}
              -n {{ k3s_namespace }}
              --ignore-not-found=true

        - name: Create new TLS secret from cert and key
          ansible.builtin.command:
            cmd: >-
              kubectl create secret tls {{ k3s_secret_name }}
              -n {{ k3s_namespace }}
              --cert=/tmp/{{ cert_name }}.crt
              --key=/tmp/{{ cert_name }}.key
          no_log: true

        - name: Restart pods to pick up new secret
          ansible.builtin.shell: >-
            kubectl rollout restart deployment -n {{ k3s_namespace }}
          changed_when: true

    # -----------------------------------------------------------------------
    # Method 3: File replacement (legacy VirtualWisdom appliances)
    # -----------------------------------------------------------------------

    - name: Renew certificate via file replacement (legacy)
      when: appliance_type == "legacy"
      block:
        - name: Backup current certificate files
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ backup_dir }}/{{ item | basename }}.{{ backup_suffix }}"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          loop:
            - "{{ legacy_cert_dir }}/server.crt"
            - "{{ legacy_key_dir }}/server.key"
          failed_when: false

        - name: Install new certificate
          ansible.builtin.copy:
            src: "{{ cert_src }}"
            dest: "{{ legacy_cert_dir }}/server.crt"
            owner: root
            group: root
            mode: "0644"
            backup: true

        - name: Install new private key
          ansible.builtin.copy:
            src: "{{ key_src }}"
            dest: "{{ legacy_key_dir }}/server.key"
            owner: root
            group: root
            mode: "0600"
            backup: true
          no_log: true

        - name: Install CA chain
          ansible.builtin.copy:
            src: "{{ chain_src }}"
            dest: "{{ legacy_cert_dir }}/ca-chain.pem"
            owner: root
            group: root
            mode: "0644"
            backup: true
          when: chain_src is defined

        - name: Restart web services
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: restarted
          loop:
            - nginx
            - virtana-web
          failed_when: false

    # -----------------------------------------------------------------------
    # Verify the new certificate is being served
    # -----------------------------------------------------------------------

    - name: Wait for web interface to come back up
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 443
        timeout: 120
        delay: 10

    - name: Verify the renewed cert is being served
      community.crypto.get_certificate:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 443
      delegate_to: localhost
      become: false
      register: live_cert

    - name: Assert the served cert matches the renewed cert
      ansible.builtin.assert:
        that:
          - live_cert.not_after == cert_info.not_after
        fail_msg: "Served cert does not match the renewed cert."
        success_msg: "Certificate renewed successfully. New expiry: {{ live_cert.not_after }}"

    - name: Clean up temporary files on appliance
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ cert_name }}.crt"
        - "/tmp/{{ cert_name }}.key"
        - "/tmp/{{ cert_name }}_chain.pem"
