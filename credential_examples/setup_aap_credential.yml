---
# One-time setup: registers a custom AAP credential type that stores ONLY what's
# needed to authenticate to CyberArk's Central Credential Provider (CCP) REST
# service. This is the single AAP credential referenced in
# per_host_cyberark_credentials.md -- it is never used to log into a target host
# directly; per-host secrets are resolved at play time (see
# get_cyberark_credential.yml / group_vars_example/all.yml).
#
# Run once against the AAP controller, e.g.:
#   ansible-playbook setup_aap_credential.yml \
#     -e controller_host=https://aap.example.com \
#     -e controller_username=admin \
#     -e controller_password=secret \
#     -e cyberark_ccp_url=https://cyberark.example.com \
#     -e cyberark_ccp_app_id=AAP-Automation
#
# Requires the ansible.controller collection (awx.awx on older AAP/Tower).

- name: Register CyberArk CCP connection credential type and credential
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - ansible.controller

  tasks:
    - name: Create the "CyberArk CCP Connection" custom credential type
      ansible.controller.credential_type:
        name: "CyberArk CCP Connection"
        description: >-
          Connection details for CyberArk's Central Credential Provider (CCP)
          REST service. Does NOT contain a target-host password -- per-host
          secrets are resolved at play time against the CCP REST API.
        kind: cloud
        inputs:
          fields:
            - id: url
              type: string
              label: CCP Base URL
            - id: app_id
              type: string
              label: CyberArk Application ID
            - id: client_cert
              type: string
              label: Client Certificate (PEM)
              secret: true
              multiline: true
            - id: client_key
              type: string
              label: Client Certificate Key (PEM)
              secret: true
              multiline: true
          required:
            - url
            - app_id
        injectors:
          extra_vars:
            cyberark_ccp_url: "{{ url }}"
            cyberark_ccp_app_id: "{{ app_id }}"
            cyberark_ccp_client_cert: "{{ client_cert }}"
            cyberark_ccp_client_key: "{{ client_key }}"
        state: present

    - name: Create the CyberArk CCP connection credential
      ansible.controller.credential:
        name: "CyberArk CCP"
        organization: "Default"
        credential_type: "CyberArk CCP Connection"
        inputs:
          url: "{{ cyberark_ccp_url }}"
          app_id: "{{ cyberark_ccp_app_id }}"
          client_cert: "{{ cyberark_ccp_client_cert | default('') }}"
          client_key: "{{ cyberark_ccp_client_key | default('') }}"
        state: present
      no_log: true
...
