---
# Standalone connectivity test for CyberArk's Central Credential Provider (CCP).
# Use this to validate the app ID, Safe/Object naming convention, and TLS settings
# BEFORE wiring the lookup into real inventory (see group_vars_example/all.yml).
#
# See per_host_cyberark_credentials.md for why this calls the CCP REST API
# directly (ansible.builtin.url) instead of a CyberArk-specific collection.
#
# Run with:
#   ansible-playbook get_cyberark_credential.yml \
#     -e cyberark_ccp_url=https://cyberark.example.com \
#     -e cyberark_ccp_app_id=AAP-Automation \
#     -e cyberark_safe=LINUX_SERVERS \
#     -e target_hostname=web01.example.com

- name: Test retrieval of a per-host secret from CyberArk CCP
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cyberark_ccp_url: "https://cyberark.example.com"  # Replace with your CCP base URL
    cyberark_ccp_app_id: "AAP-Automation"              # Replace with your registered Application ID
    cyberark_safe: "LINUX_SERVERS"                     # Replace with your Safe name
    target_hostname: "web01.example.com"               # Replace: simulates inventory_hostname
    # Optional: only needed if your CCP deployment requires mutual TLS.
    cyberark_ccp_client_cert: ""
    cyberark_ccp_client_key: ""

  tasks:
    - name: Query CyberArk CCP for the per-host account
      ansible.builtin.set_fact:
        cyberark_response: >-
          {{ lookup('ansible.builtin.url',
                     cyberark_ccp_url ~ '/AIMWebService/api/Accounts'
                     ~ '?AppID=' ~ cyberark_ccp_app_id
                     ~ '&Safe=' ~ cyberark_safe
                     ~ '&Object=' ~ target_hostname ~ '-admin',
                     client_cert=cyberark_ccp_client_cert | default(omit),
                     client_key=cyberark_ccp_client_key | default(omit),
                     validate_certs=true) | from_json }}
      no_log: true

    - name: Confirm a secret was retrieved (without ever printing it)
      ansible.builtin.debug:
        msg: >-
          Retrieved an account for {{ target_hostname }}:
          username={{ cyberark_response.UserName | default('unknown') }},
          password non-empty={{ (cyberark_response.Content | default('')) | length > 0 }}

    # - name: NEVER do this outside of a locked-down debugging session
    #   ansible.builtin.debug:
    #     msg: "The retrieved password is: {{ cyberark_response.Content }}"
...
