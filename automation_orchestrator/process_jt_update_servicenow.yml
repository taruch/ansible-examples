---
- name: Process Triage Findings and Update ServiceNow
  hosts: localhost
  gather_facts: false
  vars:
    # Passed in from AO via extra_vars
    snow_incident: "{{ incident_number }}"

    # Injected by the "Controller Credential" (Red Hat Ansible Automation
    # Platform credential type) on the job template.
    controller_hostname: "{{ aap_hostname | default(lookup('env', 'CONTROLLER_HOST')) }}"
    controller_username: "{{ aap_username | default(lookup('env', 'CONTROLLER_USERNAME')) }}"
    controller_password: "{{ aap_password | default(lookup('env', 'CONTROLLER_PASSWORD')) }}"
    controller_validate_certs: "{{ aap_validate_certs | default(lookup('env', 'CONTROLLER_VERIFY_SSL')) }}"

    # A real newline character. YAML double-quoted scalars decode \n to an
    # actual newline byte; a Jinja string literal like join('\n') written
    # inside a template does NOT - Ansible's templating leaves it as the two
    # literal characters \ and n. Pass this var into join() instead.
    nl: "\n"

  tasks:
    # =========================================================================
    # Step -1: Parse triage_result into a native object.
    # AO's "format decision as JSON" step uses a response schema, so
    # triage_result normally already arrives as a native object - but keep
    # the defensive fallback (string that needs from_json, or a
    # truncated/duplicated response) since we've seen both happen.
    # =========================================================================
    - name: Parse triage_result into a native object
      block:
        - name: Attempt direct parse of triage_result
          ansible.builtin.set_fact:
            triage: "{{ triage_result if triage_result is mapping else (triage_result | from_json) }}"
      rescue:
        - name: Recover by parsing only the last complete JSON object in triage_result
          block:
            - name: Extract and parse the last {...} object in triage_result
              ansible.builtin.set_fact:
                triage: "{{ ('{' ~ (triage_result.split('{') | last)) | from_json }}"
          rescue:
            - name: Fail with a clear diagnostic when triage_result cannot be recovered
              # Two distinct failure signatures observed in practice:
              #   1. No '{' anywhere - plain prose, not a failed JSON attempt.
              #      The JSON-formatting step either didn't run, or its
              #      output isn't what's wired into this job template's
              #      triage_result extra_var - check the AO workflow graph.
              #   2. Has '{' but still won't parse - a genuine malformed/
              #      truncated JSON response from the formatting step itself.
              ansible.builtin.fail:
                msg: >-
                  {% if '{' not in (triage_result | default('') | string) -%}
                  triage_result does not look like JSON at all (no '{' found
                  anywhere) - it looks like plain text, e.g. a raw decision
                  note. This usually means the JSON-formatting step in AO
                  either did not run, or its output is not what's wired into
                  this job template's triage_result extra_var (it may still
                  be bound to an earlier step's raw output). Check the AO
                  workflow graph before changing this playbook or that
                  step's prompt. Raw value (first 500 chars):
                  {{ triage_result | default('') | string | truncate(500) }}
                  {%- else -%}
                  triage_result could not be parsed as JSON, even after
                  attempting to recover a truncated/duplicated AI response by
                  taking the last complete JSON object. This usually means
                  the upstream AI triage step hit a token limit or produced
                  something more mangled than a simple duplication. Raw
                  value (first 500 chars):
                  {{ triage_result | default('') | string | truncate(500) }}
                  {%- endif %}

    - name: Fail fast if job_launched is true but job_id is missing
      ansible.builtin.assert:
        that:
          - triage.job_id is defined and triage.job_id
        fail_msg: >-
          triage.job_launched is true but triage.job_id is missing.
          template_id ({{ triage.template_id | default('?') }}) is the job
          TEMPLATE's ID, not the specific job run that was launched - the
          "format decision as JSON" schema/prompt needs to also capture the
          actual job ID (mentioned in Step 1's note, e.g. "Job 6817
          launched...") as its own field for this playbook to wait on it and
          fetch its artifacts.
      when: triage.job_launched | bool

    # =========================================================================
    # Step 0: Exchange username/password for a Gateway OAuth token.
    # AAP 2.5+ Gateway does not support Basic auth for token creation, so
    # ansible.controller modules given only username/password fail with
    # "Failed to get token: HTTP Error 404: Not Found".
    # =========================================================================
    - name: "Setup authentication (block)"
      when: controller_oauthtoken is not defined
      block:
        - name: "Get the Authentication Token for the future requests"
          ansible.builtin.uri:
            url: "https://{{ controller_hostname }}/api/gateway/v1/tokens/"
            user: "{{ controller_username }}"
            password: "{{ controller_password }}"
            method: POST
            force_basic_auth: true
            validate_certs: "{{ controller_validate_certs }}"
            status_code: 201
          register: authtoken_res
          no_log: true

        - name: "Set the oauth token to be used since now"
          ansible.builtin.set_fact:
            controller_oauthtoken: "{{ authtoken_res.json.token }}"
          no_log: true

    # =========================================================================
    # Step 1: Wait for Controller Job (Runs ONLY if triage launched a job)
    # =========================================================================
    - name: Wait for troubleshooting job to finish
      when: triage.job_launched | bool
      ansible.controller.job_wait:
        job_id: "{{ triage.job_id }}"
        controller_oauthtoken: "{{ controller_oauthtoken }}"
        timeout: 600
        request_timeout: 10
      register: finished_job

    # ansible.controller.job_wait only returns flat fields (id, status,
    # elapsed, started, finished) - no artifacts. Fetch the full job record
    # directly to get artifacts.
    - name: Get finished job details
      when: triage.job_launched | bool
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/controller/v2/jobs/{{ triage.job_id }}/"
        headers:
          Authorization: "Bearer {{ controller_oauthtoken }}"
        validate_certs: "{{ controller_validate_certs }}"
        status_code: 200
      register: job_details

    - name: Extract apache_diagnostics artifact
      when: triage.job_launched | bool
      ansible.builtin.set_fact:
        # Resolves artifact whether Controller stored it globally or keyed under host
        diag: >-
          {{
            job_details.json.artifacts.apache_diagnostics
            | default(job_details.json.artifacts.values() | map(attribute='apache_diagnostics') | first | default({}))
          }}

    # =========================================================================
    # Step 2: Update ServiceNow Incident (Always runs)
    # =========================================================================
    - name: Post Triage and Diagnostic Findings to ServiceNow
      servicenow.itsm.incident:
        number: "{{ snow_incident }}"
        other:
          work_notes: |
            [code]<b>=== AI Triage Summary ===</b>[/code]
            {{ triage.servicenow_work_notes }}

            * Priority: {{ triage.selected_priority }}
            * Justification: {{ triage.justification }}
            * Execution Summary: {{ triage.execution_summary }}

            {% if triage.job_launched | bool %}
            [code]<b>=== Execution Details ===</b>[/code]
            * Template: {{ triage.template_name }} (ID: {{ triage.template_id }})
            * Controller Job ID: {{ triage.job_id }}
            * Status: {{ finished_job.status | upper }}

            {% if diag | length > 0 %}
            [code]<b>=== Apache Diagnostic Report ===</b>[/code]
            * Host: {{ diag.host | default('N/A') }} ({{ diag.system_info.os_distribution }} {{ diag.system_info.os_version }})
            * Service State: <b>{{ diag.service_status.ActiveState | default('N/A') }}</b> (SubState: {{ diag.service_status.SubState | default('N/A') }}, Result: {{ diag.service_status.Result | default('N/A') }})
            * Syntax Test: <b>{{ 'PASSED' if diag.config_test.passed else 'FAILED' }}</b>
            * Listening Ports (80/443): {{ diag.listening_ports | default([]) | join(', ') | default('None detected', true) }}
            * SELinux Mode: {{ diag.selinux.mode | default('unknown') }}

            {% if not diag.config_test.passed and (diag.config_test.output | default([]) | length > 0) %}
            [code]<b>Config Test Errors:</b><pre>{{ diag.config_test.output | join(nl) }}</pre>[/code]
            {% endif %}

            {% if diag.error_log_recent | default([]) | length > 0 %}
            [code]<b>Recent Error Log Lines:</b><pre>{{ diag.error_log_recent[-10:] | join(nl) }}</pre>[/code]
            {% endif %}

            {% if diag.selinux.recent_denials | default([]) | length > 0 %}
            [code]<b>SELinux Denials Detected:</b><pre>{{ diag.selinux.recent_denials | join(nl) }}</pre>[/code]
            {% endif %}
            {% else %}
            <i>Warning: Job finished with status '{{ finished_job.status }}' but produced no artifact data.</i>
            {% endif %}

            {% else %}
            [code]<b>=== Manual Triage Required ===</b>[/code]
            No automated job was executed.
            {% endif %}

            {% if triage.manual_steps | default([]) | length > 0 %}
            [code]<b>=== Prescribed Manual Next Steps ===</b>[/code]
            {% for step in triage.manual_steps %}
            {{ loop.index }}. {{ step }}
            {% endfor %}
            {% endif %}