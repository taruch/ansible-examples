---
# Imports workflow definitions previously exported by export_ao_config.yml
# into a (possibly different/new) Automation Orchestrator (AO) instance.
#
# For each exported workflow (import_dir/workflows/<project>/<workflow>.json
# + matching .meta.json), the source project - by name, from the
# .meta.json's source_project_name - is created on the target instance if
# it doesn't already exist, then the workflow is created via
# POST /api/v1/workflows with is_import: true, the flag AO's own API
# describes as being for "importing workflows from other instances" (it
# clears unavailable LLM models with warnings, and drops missing
# webhook/EDA-authorized service account bindings, instead of rejecting the
# import outright). That leniency does NOT cover a node's own credential_id/
# integration_id/integration_connections references, though - AO
# hard-rejects the whole workflow with a 422 if those point at a credential
# or integration missing on the target. So before importing workflows, this
# playbook also recreates every credential type/credential/integration
# referenced by an imported project (matched by name) if missing on the
# target, and rewrites each workflow definition's embedded credential and
# integration ids to the target instance's ids.
#
# Idempotent: skips (does not overwrite) any workflow whose name already
# exists in the target project.
#
# Newly-imported workflows are created as an unpublished draft version -
# AO requires an explicit publish step (POST
# /workflows/{id}/versions/{version}/publish) before a workflow actually
# runs. This playbook does not publish automatically; review each imported
# workflow before publishing it on the target.
#
# Credential secret values are NOT recoverable (export_ao_config.yml never
# exports them - the AO API always masks secret credential inputs as
# "$encrypted$"), so any credential created here gets a dummy
# "PLACEHOLDER-<name>" value for every secret field instead - printed at the
# end of the run. Fine for this repo's throwaway demo/workshop targets;
# replace the placeholder values by hand (or in the target's vault) before
# relying on the credential for anything real.
#
# Required variables:
#   - ao_base_url: target AO instance URL
#   - ao_username / ao_password: your AO user credentials on the TARGET
#     instance (needs project:create and workflow:create permissions)
#   - import_dir: directory previously produced by export_ao_config.yml
#
# Usage:
#   ansible-playbook import_ao_config.yml \
#     -e ao_base_url="https://<target-ao-instance>" \
#     -e ao_username="<username>" \
#     -e ao_password="<password>" \
#     -e import_dir="./ao_export"

- name: Import Automation Orchestrator configuration
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ao_base_url: ""
    ao_username: ""
    ao_password: ""
    import_dir: "./ao_export"
    page_limit: 100
    max_pages: 50
    # Set to false for AO instances with self-signed/untrusted certs (e.g.
    # workshop clusters). Defaults to validating certs.
    ao_validate_certs: true

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ao_base_url | length > 0
          - ao_username | length > 0
          - ao_password | length > 0
          - import_dir | length > 0
        fail_msg: "ao_base_url, ao_username, ao_password, and import_dir are required"

    - name: Log in with username and password
      ansible.builtin.uri:
        url: "{{ ao_base_url }}/api/v1/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ ao_username }}"
          password: "{{ ao_password }}"
        validate_certs: "{{ ao_validate_certs }}"
        status_code: 200
      register: ao_token_response
      no_log: true

    - name: Set auth header fact
      ansible.builtin.set_fact:
        ao_auth_header:
          Authorization: "Bearer {{ ao_token_response.json.access_token }}"

    #
    # Load what was exported
    #
    - name: Find exported workflow metadata files
      ansible.builtin.find:
        paths: "{{ import_dir }}/workflows"
        patterns: "*.meta.json"
        recurse: true
      register: ao_meta_files

    - name: Fail if nothing to import
      ansible.builtin.assert:
        that:
          - ao_meta_files.matched > 0
        fail_msg: "No exported workflow .meta.json files found under {{ import_dir }}/workflows - nothing to import."

    - name: Load workflow metadata
      ansible.builtin.set_fact:
        ao_import_items: >-
          {{ ao_import_items | default([]) + [
            (lookup('file', item.path) | from_json) | combine({
              '_definition_path': item.path | regex_replace('\.meta\.json$', '.json')
            })
          ] }}
      loop: "{{ ao_meta_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    #
    # Fetch existing target projects and workflows (for idempotency)
    #
    - name: Fetch existing target projects
      vars:
        ao_paginate_path: /api/v1/projects
      ansible.builtin.include_tasks: tasks/ao_paginate.yml

    - name: Build target project name-to-id lookup
      ansible.builtin.set_fact:
        ao_target_project_ids: "{{ dict(ao_paginate_result | map(attribute='name') | zip(ao_paginate_result | map(attribute='id'))) }}"

    - name: Fetch existing target workflows
      vars:
        ao_paginate_path: /api/v1/workflows
      ansible.builtin.include_tasks: tasks/ao_paginate.yml

    - name: Save target workflows fact
      ansible.builtin.set_fact:
        ao_target_workflows: "{{ ao_paginate_result }}"

    #
    # Ensure each referenced project exists on the target
    #
    - name: Determine distinct source project names to import into
      ansible.builtin.set_fact:
        ao_import_project_names: "{{ ao_import_items | map(attribute='source_project_name') | unique | list }}"

    - name: Ensure target projects exist
      ansible.builtin.include_tasks: tasks/ao_ensure_project.yml
      loop: "{{ ao_import_project_names }}"
      loop_control:
        loop_var: ao_project_name
        label: "{{ ao_project_name }}"

    #
    # Load exported credential types/credentials/projects (source side) so
    # workflow-embedded credential ids can be resolved and recreated
    #
    - name: Load exported credential types
      ansible.builtin.set_fact:
        ao_source_credential_types: "{{ lookup('file', import_dir + '/credential_types.json') | from_json }}"

    - name: Load exported credentials
      ansible.builtin.set_fact:
        ao_source_credentials: "{{ lookup('file', import_dir + '/credentials.json') | from_json }}"

    - name: Load exported projects
      ansible.builtin.set_fact:
        ao_source_projects: "{{ lookup('file', import_dir + '/projects.json') | from_json }}"

    - name: Build source project id-to-name lookup
      ansible.builtin.set_fact:
        ao_project_names: "{{ dict(ao_source_projects | map(attribute='id') | zip(ao_source_projects | map(attribute='name'))) }}"

    - name: Build source credential type inputs-schema lookup (type id -> inputs)
      ansible.builtin.set_fact:
        ao_credential_type_inputs: "{{ dict(ao_source_credential_types | map(attribute='id') | zip(ao_source_credential_types | map(attribute='inputs'))) }}"

    #
    # Ensure every credential type exists on the target
    #
    - name: Fetch existing target credential types
      vars:
        ao_paginate_path: /api/v1/credential_types
      ansible.builtin.include_tasks: tasks/ao_paginate.yml

    - name: Build target credential type name-to-id lookup
      ansible.builtin.set_fact:
        ao_target_credential_type_ids: "{{ dict(ao_paginate_result | map(attribute='name') | zip(ao_paginate_result | map(attribute='id'))) }}"

    - name: Init source-to-target credential type id map
      ansible.builtin.set_fact:
        ao_credential_type_id_map: {}

    - name: Ensure target credential types exist
      ansible.builtin.include_tasks: tasks/ao_ensure_credential_type.yml
      loop: "{{ ao_source_credential_types }}"
      loop_control:
        loop_var: ao_credential_type
        label: "{{ ao_credential_type.name }}"

    #
    # Ensure every credential referenced by an imported project exists on
    # the target (placeholder secret values - see header comment above)
    #
    - name: Fetch existing target credentials
      vars:
        ao_paginate_path: /api/v1/credentials
      ansible.builtin.include_tasks: tasks/ao_paginate.yml

    - name: Save target credentials fact
      ansible.builtin.set_fact:
        ao_target_credentials: "{{ ao_paginate_result }}"

    - name: Init credential id map, placeholder summary, and import results summary
      ansible.builtin.set_fact:
        ao_credential_id_map: {}
        ao_created_credential_placeholders: []
        ao_import_results: []

    - name: Determine source project ids being imported
      ansible.builtin.set_fact:
        ao_import_project_ids: "{{ ao_source_projects | selectattr('name', 'in', ao_import_project_names) | map(attribute='id') | list }}"

    - name: Determine credentials referenced by imported projects
      ansible.builtin.set_fact:
        ao_import_credentials: "{{ ao_source_credentials | selectattr('project_id', 'in', ao_import_project_ids) | list }}"

    - name: Ensure target credentials exist
      ansible.builtin.include_tasks: tasks/ao_ensure_credential.yml
      loop: "{{ ao_import_credentials }}"
      loop_control:
        loop_var: ao_credential
        label: "{{ ao_credential.name }}"

    #
    # Ensure every integration (MCP Server/LLM Provider/AAP connection)
    # referenced by an imported project exists on the target. Older exports
    # (from before integrations.json was captured) won't have this file -
    # tolerate that rather than failing the whole import.
    #
    - name: Check for an exported integrations file
      ansible.builtin.stat:
        path: "{{ import_dir }}/integrations.json"
      register: ao_integrations_file_stat

    - name: Load exported integrations
      ansible.builtin.set_fact:
        ao_source_integrations: "{{ lookup('file', import_dir + '/integrations.json') | from_json }}"
      when: ao_integrations_file_stat.stat.exists

    - name: Default empty integrations list (export predates integrations.json)
      ansible.builtin.set_fact:
        ao_source_integrations: []
      when: not ao_integrations_file_stat.stat.exists

    - name: Fetch existing target integrations
      vars:
        ao_paginate_path: /api/v1/integrations
      ansible.builtin.include_tasks: tasks/ao_paginate.yml

    - name: Save target integrations fact
      ansible.builtin.set_fact:
        ao_target_integrations: "{{ ao_paginate_result }}"

    - name: Init integration id map
      ansible.builtin.set_fact:
        ao_integration_id_map: {}

    # Unlike credentials, integrations aren't necessarily project-scoped
    # (confirmed live: a real integration came back with scope: "global" and
    # an empty project_ids list) - there's no reliable "belongs to this
    # imported project" filter to apply, so every exported integration is
    # brought over. tasks/ao_ensure_integration.yml best-effort remaps
    # project_ids for the (untested) project-scoped case.
    - name: Determine integrations to import
      ansible.builtin.set_fact:
        ao_import_integrations: "{{ ao_source_integrations }}"

    - name: Ensure target integrations exist
      ansible.builtin.include_tasks: tasks/ao_ensure_integration.yml
      loop: "{{ ao_import_integrations }}"
      loop_control:
        loop_var: ao_integration
        label: "{{ ao_integration.name }}"

    #
    # Import each workflow
    #
    - name: Import each workflow
      ansible.builtin.include_tasks: tasks/ao_import_workflow.yml
      loop: "{{ ao_import_items }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Display import summary
      ansible.builtin.debug:
        msg:
          - "=== AO IMPORT SUMMARY ==="
          - "Source directory: {{ import_dir }}"
          - "Projects referenced: {{ ao_import_project_names | length }}"
          - "Workflows processed: {{ ao_import_items | length }}"
          - "Per-workflow results:"
          - "{{ ao_import_results }}"
          - "Credentials created with PLACEHOLDER secret values: {{ ao_created_credential_placeholders | length }}"
          - "{{ ao_created_credential_placeholders }}"
          - "Reminder: the credentials above are dummy values - replace them (target instance, by name) before relying on the workflow for anything real."
          - "Reminder: imported workflows are unpublished drafts - publish each one on the target before it can run."
          - "Reminder: a newly-created integration has no tools/models synced yet - any workflow's tool_selections from the OLD sync are gone; re-pick tools by hand in the AO UI for that workflow. Any FAILED integration/workflow above should be recreated by hand in the AO UI, then this playbook re-run (idempotent, picks up only what's still missing)."
