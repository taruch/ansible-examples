---
# Triggers an AO webhook from a generic event source (Dynatrace, Splunk,
# etc.). When display_id is set, event_payload is always rebuilt from the
# flat Dynatrace problem fields below - matches what the
# dynatrace_event_triage.yml EDA rulebook's "AI Triage - Evaluate Unmatched
# Event" rule passes as extra_vars - and forwarded under their native
# Dynatrace field names (unlike trigger_ao_servicenow.yml, which renames
# ServiceNow incident fields into its own schema - the two event sources
# feed different AO workflows with different trigger contracts, so don't
# assume a shared schema). event_payload is only forwarded unmodified when
# display_id is empty (a non-Dynatrace caller assembled it directly).

- name: Trigger EDA webhook
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    webhook_base_url: ""
    # Full path suffix after /api/v1/webhooks/, e.g.:
    #   "29f4ab88-dff5-460c-a6d9-ec504382eb25"       (generic AO trigger)
    #   "eda/7024302e-4beb-4473-8efc-8eceb2c05207"   (EDA-specific trigger)
    webhook_path: ""
    webhook_client_id: ""
    webhook_client_secret: ""

    # If display_id is set, event_payload is always rebuilt below from these
    # flat Dynatrace problem fields, overriding whatever was passed in - the
    # caller (dynatrace_event_triage.yml) currently also sets a stale,
    # incorrectly-nested event_payload alongside these flat fields, so it
    # can't be trusted as-is. event_payload is only forwarded unmodified
    # when display_id is empty (i.e. a non-Dynatrace caller assembled it
    # directly).
    eventData: {}
    display_id: ""
    event: ""
    problem_id: ""
    event_category: ""
    event_name: ""
    _hosts: []

    # Set to false for AO instances with self-signed/untrusted certs (e.g.
    # workshop clusters). Defaults to validating certs.
    webhook_validate_certs: true

  tasks:
    - name: Obtain OAuth token
      register: token_response
      no_log: true
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ webhook_client_id }}"
          client_secret: "{{ webhook_client_secret }}"
        validate_certs: "{{ webhook_validate_certs }}"
        status_code: 200

    - name: Build event payload from Dynatrace problem fields
      when: display_id | length > 0
      ansible.builtin.set_fact:
        eventData: "{{ event_payload.eventData }}"

    - name: Debug eventData
      ansible.builtin.debug:
        var: eventData

    - name: Post event payload to Event-Driven Ansible trigger endpoint
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/webhooks/{{ webhook_path }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ token_response.json.access_token }}"
          Content-Type: application/json
        body: "{{ eventData }}"
        validate_certs: "{{ webhook_validate_certs }}"
        status_code: 202
      register: webhook_response

    - name: Display execution ID
      ansible.builtin.debug:
        msg: "Workflow execution started: {{ webhook_response.json.execution_id }}"
