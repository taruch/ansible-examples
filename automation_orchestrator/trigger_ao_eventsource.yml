---
# Triggers an AO webhook from a generic event source (Dynatrace, Splunk,
# etc.). The caller (e.g. dynatrace_event_triage.yml) passes the raw event
# data as event_payload.eventData; AO's trigger schema requires eventData
# to be a string, not a nested object, so this playbook unwraps it and
# posts the raw fields directly as the top-level JSON body instead of
# nesting them under an "eventData" key.

- name: Trigger EDA webhook
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    webhook_base_url: ""
    # Full path suffix after /api/v1/webhooks/, e.g.:
    #   "29f4ab88-dff5-460c-a6d9-ec504382eb25"       (generic AO trigger)
    #   "eda/7024302e-4beb-4473-8efc-8eceb2c05207"   (EDA-specific trigger)
    webhook_path: ""
    webhook_client_id: ""
    webhook_client_secret: ""

    # Required: event_payload.eventData holds the raw event fields to send
    # to AO, unwrapped, as the top-level JSON body.
    event_payload: {}
    eventData: {}

    # Set to false for AO instances with self-signed/untrusted certs (e.g.
    # workshop clusters). Defaults to validating certs.
    webhook_validate_certs: true

  tasks:
    - name: Obtain OAuth token
      register: token_response
      no_log: true
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ webhook_client_id }}"
          client_secret: "{{ webhook_client_secret }}"
        validate_certs: "{{ webhook_validate_certs }}"
        status_code: 200

    - name: Unwrap eventData from event_payload
      when: event_payload.eventData is defined
      ansible.builtin.set_fact:
        eventData: "{{ event_payload.eventData }}"

    - name: Sanitize eventData field names and values (AO rejects dots in keys and requires string values)
      ansible.builtin.set_fact:
        eventData_sanitized: "{{ eventData_sanitized | default({}) | combine({ item.key | replace('.', '_'): item.value | string }) }}"
      loop: "{{ eventData | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Replace eventData with sanitized field names
      ansible.builtin.set_fact:
        eventData: "{{ eventData_sanitized }}"

    - name: Debug eventData
      ansible.builtin.debug:
        var: eventData

    - name: Post event payload to Event-Driven Ansible trigger endpoint
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/webhooks/{{ webhook_path }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ token_response.json.access_token }}"
          Content-Type: application/json
        body: "{{ eventData }}"
        validate_certs: "{{ webhook_validate_certs }}"
        status_code: 202
      register: webhook_response

    - name: Display execution ID
      ansible.builtin.debug:
        msg: "Workflow execution started: {{ webhook_response.json.execution_id }}"
