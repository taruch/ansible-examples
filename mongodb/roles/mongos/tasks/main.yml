---
# Deploys a mongos query router that talks to the config server replica set.

- name: Deploy the mongos configuration file
  ansible.builtin.template:
    src: mongos.conf.j2
    dest: /etc/mongos.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mongos

- name: Deploy the systemd unit for mongos
  ansible.builtin.template:
    src: mongos.service.j2
    dest: /etc/systemd/system/mongos.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart mongos

- name: Start and enable the mongos service
  ansible.builtin.systemd:
    name: mongos
    daemon_reload: true
    state: started
    enabled: true

- name: Wait for mongos to accept connections
  ansible.builtin.wait_for:
    host: "{{ inventory_hostname }}"
    port: "{{ mongos_port }}"
    timeout: 60
