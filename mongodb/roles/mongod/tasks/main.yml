---
# Deploys one member of the shard replica set (mongod_replica_set_name).

- name: Create the data directory for this shard member
  ansible.builtin.file:
    path: "{{ mongodb_data_dir }}/{{ mongod_replica_set_name }}"
    state: directory
    owner: mongod
    group: mongod
    mode: "0755"

- name: Deploy the mongod configuration file for the shard member
  ansible.builtin.template:
    src: mongod-shard.conf.j2
    dest: /etc/mongod-shard.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mongod-shard

- name: Deploy the systemd unit for the shard mongod instance
  ansible.builtin.template:
    src: mongod-shard.service.j2
    dest: /etc/systemd/system/mongod-shard.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart mongod-shard

- name: Start and enable the shard mongod service
  ansible.builtin.systemd:
    name: mongod-shard
    daemon_reload: true
    state: started
    enabled: true

- name: Wait for the shard mongod instance to accept connections
  ansible.builtin.wait_for:
    host: "{{ inventory_hostname }}"
    port: "{{ mongod_port }}"
    timeout: 60

- name: Build the list of shard replica set members
  ansible.builtin.set_fact:
    mongod_replicaset_members: "{{ groups['mongo_servers'] | map('regex_replace', '^(.*)$', '\\1:' + (mongod_port | string)) | list }}"
  delegate_to: "{{ groups['mongo_servers'][0] }}"
  delegate_facts: true
  run_once: true

- name: Initiate the shard replica set
  community.mongodb.mongodb_replicaset:
    login_host: "{{ groups['mongo_servers'][0] }}"
    login_port: "{{ mongod_port }}"
    replica_set: "{{ mongod_replica_set_name }}"
    members: "{{ hostvars[groups['mongo_servers'][0]].mongod_replicaset_members }}"
  delegate_to: "{{ groups['mongo_servers'][0] }}"
  run_once: true
