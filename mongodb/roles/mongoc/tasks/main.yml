---
# Deploys one member of the config server replica set (mongoc_replica_set_name).

- name: Create the data directory for the config server
  ansible.builtin.file:
    path: "{{ mongodb_data_dir }}/configdb"
    state: directory
    owner: mongod
    group: mongod
    mode: "0755"

- name: Deploy the mongod configuration file for the config server
  ansible.builtin.template:
    src: mongod-configsvr.conf.j2
    dest: /etc/mongod-configsvr.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mongod-configsvr

- name: Deploy the systemd unit for the config server mongod instance
  ansible.builtin.template:
    src: mongod-configsvr.service.j2
    dest: /etc/systemd/system/mongod-configsvr.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart mongod-configsvr

- name: Start and enable the config server mongod service
  ansible.builtin.systemd:
    name: mongod-configsvr
    daemon_reload: true
    state: started
    enabled: true

- name: Wait for the config server mongod instance to accept connections
  ansible.builtin.wait_for:
    host: "{{ inventory_hostname }}"
    port: "{{ mongoc_port }}"
    timeout: 60

- name: Initiate the config server replica set
  community.mongodb.mongodb_replicaset:
    login_host: "{{ groups['mongoc_servers'][0] }}"
    login_port: "{{ mongoc_port }}"
    replica_set: "{{ mongoc_replica_set_name }}"
    members: "{{ groups['mongoc_servers'] | map('regex_replace', '^(.*)$', '\\1:' + (mongoc_port | string)) | list }}"
  run_once: true
  delegate_to: "{{ groups['mongoc_servers'][0] }}"
