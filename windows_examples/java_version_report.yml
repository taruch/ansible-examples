---
# Report on Java installations across Windows hosts and flag outdated versions
#
# Usage:
#   ansible-playbook java_version_report.yml
#   ansible-playbook java_version_report.yml -e "required_java_version=17.0.13"
#   ansible-playbook java_version_report.yml -e "_hosts=webservers"

- name: Java Version Compliance Report
  hosts: "{{ _hosts | default('all') }}"
  gather_facts: false

  vars:
    required_java_version: "17.0.13"

  tasks:
    - name: Query installed Java versions from the registry
      ansible.windows.win_powershell:
        script: |
          $javaInstalls = @()
          $uninstallPaths = @(
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          foreach ($path in $uninstallPaths) {
              Get-ItemProperty $path -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -match 'Java|JDK|JRE|OpenJDK|Temurin|Corretto|Zulu' } |
                  ForEach-Object {
                      $javaInstalls += [PSCustomObject]@{
                          name    = $_.DisplayName
                          version = $_.DisplayVersion
                          vendor  = $_.Publisher
                      }
                  }
          }
          $javaInstalls
      register: java_query
      failed_when: false

    - name: Check JAVA_HOME and PATH for unregistered Java
      ansible.windows.win_powershell:
        script: |
          $found = @()
          $seen = @{}

          # Check JAVA_HOME
          $javaHome = [Environment]::GetEnvironmentVariable('JAVA_HOME', 'Machine')
          if ($javaHome -and (Test-Path "$javaHome\bin\java.exe")) {
              $ver = & "$javaHome\bin\java.exe" -version 2>&1 | Select-String -Pattern '"(.+?)"'
              $version = if ($ver) { $ver.Matches[0].Groups[1].Value } else { 'unknown' }
              $key = "$javaHome\bin\java.exe"
              $seen[$key] = $true
              $found += [PSCustomObject]@{
                  name    = "Java (JAVA_HOME)"
                  version = $version
                  vendor  = "JAVA_HOME: $javaHome"
              }
          }

          # Check PATH for java.exe not already found via JAVA_HOME
          $pathDirs = [Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';'
          foreach ($dir in $pathDirs) {
              $javaExe = Join-Path $dir 'java.exe'
              if ((Test-Path $javaExe) -and -not $seen.ContainsKey($javaExe)) {
                  $seen[$javaExe] = $true
                  $ver = & $javaExe -version 2>&1 | Select-String -Pattern '"(.+?)"'
                  $version = if ($ver) { $ver.Matches[0].Groups[1].Value } else { 'unknown' }
                  $found += [PSCustomObject]@{
                      name    = "Java (PATH)"
                      version = $version
                      vendor  = "PATH: $dir"
                  }
              }
          }
          $found
      register: java_path_query
      failed_when: false

    - name: Set Java facts per host
      ansible.builtin.set_fact:
        java_installed: "{{ (java_query.output | default([]) | length + java_path_query.output | default([]) | length) > 0 }}"
        java_versions: "{{ (java_query.output | default([])) + (java_path_query.output | default([])) }}"

    - name: Flag outdated Java installations
      ansible.builtin.set_fact:
        outdated_java: >-
          {{ java_versions | selectattr('version', 'defined')
             | selectattr('version', 'version', required_java_version, '<')
             | list }}
        current_java: >-
          {{ java_versions | selectattr('version', 'defined')
             | selectattr('version', 'version', required_java_version, '>=')
             | list }}
      when: java_installed

    - name: Print per-host Java status
      ansible.builtin.debug:
        msg: |
          {% if not java_installed %}
          NOT INSTALLED        | N/A
          {% else %}
          {% for j in java_versions %}
          {{ "%-20s" | format(j.version | default("unknown")) }} | {{ "OUT OF COMPLIANCE" if j.version is version(required_java_version, "<") else "COMPLIANT" }}
          {% endfor %}
          {% endif %}
